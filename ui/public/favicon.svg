<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <!-- Icon Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />

  <!-- Stylized Glow Container -->
  <g filter="url(#glow)">
    <!-- Checkbox Square Base -->
    <rect x="136" y="136" width="240" height="240" rx="48" fill="#ffffff" />
    
    <!-- Checkmark Path -->
    <path d="M188 256 L232 300 L324 200" 
          fill="none" 
          stroke="url(#bgGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>